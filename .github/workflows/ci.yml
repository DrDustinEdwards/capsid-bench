name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run; a push to the default branch never does.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The one check the ruleset requires carries the others: a red seed or seal job fails this one, so it cannot merge.
    needs: [seed, seal]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: The other jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in ${RESULTS}; do [ "${r}" = success ] || { echo "a job this one needs ended ${r}" >&2; exit 1; }; done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install the lint tooling
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test the scripts
        run: node --test test/

      - name: Test the validation verdict
        run: python3 -m unittest discover -s test -p 'test_*.py'

      - name: Check every task file
        run: |
          set -euo pipefail
          for f in tasks/*.json; do
            [ -e "$f" ] || continue
            node scripts/task.mjs check "$f"
            # The file name is the task id, which is how a run finds it.
            [ "$(node -p 'require(process.argv[1]).task_id' "$PWD/$f")" = "$(basename "$f" .json)" ] || { echo "$f: file name and task_id differ" >&2; exit 1; }
          done

  seed:
    # scripts/seed.mjs against drand itself: a past quicknet round must fetch and verify,
    # so the registered round's check is known to work before it is needed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Verify a past quicknet round
        run: |
          set -euo pipefail
          npm ci --silent --ignore-scripts --prefix tools
          NOBLE_BLS="${PWD}/tools/node_modules/@noble/curves/bls12-381.js" node scripts/seed.mjs --round 1000

  seal:
    permissions:
      contents: read
      id-token: write
    # The seal's time-lock against drand itself (scripts/seal.mjs): a bundle locked to a
    # published quicknet round must open, and its header must name that round.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Lock to a past round and open it
        run: |
          set -euo pipefail
          npm ci --silent --ignore-scripts --prefix tools
          SEAL_MODULES="${PWD}/tools/node_modules" node --input-type=module -e '
            import { createRequire } from "node:module";
            import { lockedRound } from "./scripts/unseal.mjs";
            const tlock = createRequire(process.env.SEAL_MODULES + "/x.cjs")("tlock-js");
            const client = tlock.mainnetClient();
            const armored = await tlock.timelockEncrypt(1000, Buffer.from("sample"), client);
            if (lockedRound(armored) !== 1000) throw new Error("wrong round in the header");
            const plain = await tlock.timelockDecrypt(armored, client);
            if (plain.toString() !== "sample") throw new Error("did not open");
            console.log("round 1000 locked and opened");
          '

      - name: Sign with Sigstore and verify the identity and commit
        # On main only: this writes a public Rekor entry. It checks the way
        # scripts/unseal.mjs verifies a seal, with this workflow's identity in place of
        # the retired bench-run.yml's.
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # single quotes on purpose: the script is JavaScript for node
          SEAL_MODULES="${PWD}/tools/node_modules" node --input-type=module -e '
            import { createRequire } from "node:module";
            import { ACTIONS_ISSUER, WORKFLOW_SHA_OID } from "./scripts/unseal.mjs";
            const sigstore = createRequire(process.env.SEAL_MODULES + "/x.cjs")("sigstore");
            const data = Buffer.from("capsid-bench seal check " + process.env.GITHUB_SHA);
            const bundle = await sigstore.sign(data);
            const identity = `https://github.com/${process.env.GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main`;
            const verifier = await sigstore.createVerifier({ certificateIdentityURI: identity, certificateIssuer: ACTIONS_ISSUER, certificateOIDs: { [WORKFLOW_SHA_OID]: process.env.GITHUB_SHA } });
            verifier.verify(bundle, data);
            let refused = false;
            try { (await sigstore.createVerifier({ certificateIdentityURI: identity, certificateIssuer: ACTIONS_ISSUER, certificateOIDs: { [WORKFLOW_SHA_OID]: "0".repeat(40) } })).verify(bundle, data); } catch { refused = true; }
            if (!refused) throw new Error("a wrong commit verified");
            console.log("signed at Rekor index", bundle.verificationMaterial.tlogEntries[0].logIndex);
          '
