name: bench-list

# List a dataset's instances opened after the model's cutoff, with their test counts, so
# pilot and full ids can be chosen. Reads Hugging Face only: registers nothing, starts no
# run, calls no model.

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Hugging Face dataset
        default: nebius/SWE-rebench-leaderboard

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: List the candidates
        env:
          DATASET: ${{ inputs.dataset }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet duckdb==1.2.2
          python3 scripts/list-hf.py "${DATASET}" | tee -a "$GITHUB_STEP_SUMMARY"
