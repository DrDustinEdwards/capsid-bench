name: bench-list

# List a dataset's instances opened after the model's cutoff, with their test counts, so
# pilot and full ids can be chosen; or, with `when: before`, the newest ones opened before
# it, for practice tasks (split excluded, protocol section 2). Reads Hugging Face only:
# registers nothing, starts no run, calls no model.

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Hugging Face dataset
        default: nebius/SWE-rebench-leaderboard
      when:
        description: Instances opened after the cutoff, or before it (practice)
        type: choice
        options: [after, before]
        default: after

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: List the candidates
        env:
          DATASET: ${{ inputs.dataset }}
          WHEN: ${{ inputs.when }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet duckdb==1.5.5
          python3 scripts/list-hf.py "${DATASET}" "${WHEN}" | tee -a "$GITHUB_STEP_SUMMARY"
